[project]
name = "airbnb-api"
version = "0.1.0"
description = "Airbnb clone REST API (FastAPI + SQLite)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "slowapi>=0.1.9",
    "pillow>=10.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # third-party: starlette nudging TestClient users towards httpx2
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

# --- Architecture contracts (SOLID / ports & adapters, SYSTEM_DESIGN §3.3) ---
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure: no framework, ORM or outer layers"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.services", "app.adapters", "app.api", "app.core", "sqlalchemy", "fastapi"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Services depend on ports, never on adapters, ORM or HTTP"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.adapters", "app.api", "sqlalchemy", "fastapi"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Ports are abstractions only"
type = "forbidden"
source_modules = ["app.ports"]
forbidden_modules = ["app.adapters", "app.services", "app.api", "sqlalchemy", "fastapi"]
allow_indirect_imports = true
